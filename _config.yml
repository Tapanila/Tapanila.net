# Site wide configuration

title:            Tapanila.net
name:             Tapanila.net
locale:           en_US
url:              https://tapanila.net
baseurl:          ""


# Jekyll configuration

permalink:   /:title/
markdown:    kramdown
highlighter: rouge
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-sitemap
  - jekyll-gist

kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  use_coderay: false


# Site owner
owner:
  name: Teemu Tapanila
  avatar: https://images.ctfassets.net/dife9bku7g06/6aXLdREZzsyFDuD19SGruS/be76952260014995ba6106e0ddaa364a/teemu_465.jpeg?w=465&h=465&q=100&fm=webp
  bio: "CTO of Mallow"
  email: teemu@tapanila.net
  twitter: TapanilaT
  github: Tapanila
  stackoverflow: #797074/teemu-tapanila
  linkedin: teemutapanila

include: [".htaccess"]
exclude: ["node_modules", "Gemfile", "Gemfile.lock", "LICENSE", "README.md", "Dockerfile", "docker-compose.yml", "_config.dev.yml", "_templates", "vendor"]
